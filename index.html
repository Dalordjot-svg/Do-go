<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>POS Терминал</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
    body { background: #090d16; background-image: radial-gradient(at 10% 10%, rgba(56, 189, 248, 0.1) 0px, transparent 50%), radial-gradient(at 90% 90%, rgba(16, 185, 129, 0.1) 0px, transparent 50%); color: #f8fafc; margin: 0; padding: 16px; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; }

    .header { display: flex; align-items: center; justify-content: space-between; padding: 4px 8px; }
    .brand { font-size: 20px; font-weight: 800; background: linear-gradient(135deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .header-actions { display: flex; gap: 10px; }
    .icon-btn { background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.1); color: #94a3b8; width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; }
    .icon-btn:active { transform: scale(0.92); background: rgba(255, 255, 255, 0.15); }
    .panic-btn-header { background: rgba(239, 68, 68, 0.2); border-color: rgba(239, 68, 68, 0.4); color: #ef4444; }

    .display-container { display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 10px 0; }
    .display-label { font-size: 13px; color: #64748b; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; }
    .amount-display { font-size: 52px; font-weight: 900; color: #34d399; letter-spacing: -1px; text-shadow: 0 0 25px rgba(52, 211, 153, 0.25); display: flex; align-items: baseline; gap: 6px; }
    .currency { font-size: 36px; color: #059669; }

    .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; max-width: 400px; margin: 0 auto; }
    .key { background: rgba(21, 28, 44, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 18px; height: 64px; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700; color: #f1f5f9; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3); cursor: pointer; transition: all 0.1s ease; }
    .key:active { transform: scale(0.93); background: rgba(56, 189, 248, 0.2); border-color: #38bdf8; }
    .key-action { background: rgba(239, 68, 68, 0.15); color: #f87171; border-color: rgba(239, 68, 68, 0.3); }

    .action-buttons { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 400px; margin: 12px auto 0 auto; }
    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn { width: 100%; padding: 16px; border-radius: 16px; border: none; font-size: 16px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.15s ease; }
    .btn:active { transform: scale(0.97); }
    .btn-pay { background: linear-gradient(135deg, #10b981, #059669); color: white; box-shadow: 0 8px 25px rgba(16, 185, 129, 0.35); }
    .btn-cash { background: linear-gradient(135deg, #0ea5e9, #2563eb); color: white; box-shadow: 0 8px 25px rgba(14, 165, 233, 0.35); }
    .btn-cancel { background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.3); color: #ef4444; padding: 14px; font-size: 15px; }
    .btn-panic { background: linear-gradient(135deg, #ef4444, #b91c1c); color: white; box-shadow: 0 8px 25px rgba(239, 68, 68, 0.4); }

    .status-toast { text-align: center; font-size: 14px; font-weight: 700; height: 20px; margin-top: 4px; }

    .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(9, 13, 22, 0.95); backdrop-filter: blur(20px); z-index: 100; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; overflow-y: auto; }
    .modal-card { background: rgba(21, 28, 44, 0.9); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 20px; margin-bottom: 16px; }

    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 12px; color: #94a3b8; font-weight: 700; margin-bottom: 6px; text-transform: uppercase; }
    input[type="text"], input[type="password"], input[type="number"] { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1); background: #090d16; color: white; font-size: 16px; outline: none; }

    .toggle-group { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
    .switch { position: relative; display: inline-block; width: 46px; height: 26px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #334155; transition: .3s; border-radius: 34px; }
    .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px; background-color: white; transition: .3s; border-radius: 50%; }
    input:checked + .slider { background-color: #10b981; }
    input:checked + .slider:before { transform: translateX(20px); }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- АВТОРИЗАЦИЯ -->
  <div id="auth-modal" class="modal">
    <div style="margin: auto 0; width: 100%;">
      <div class="modal-card">
        <h2 style="margin-top:0; color:#fff;">🔐 Доступ к терминалу</h2>
        <div class="form-group">
          <label>ПИН-КОД</label>
          <input type="password" id="pin-input" placeholder="****" inputmode="numeric" style="text-align: center; font-size: 24px;">
        </div>
        <button class="btn btn-pay" onclick="checkPin()" style="width:100%;">Войти</button>
        <div id="auth-error" style="color: #ef4444; text-align: center; margin-top: 10px; font-weight: 700;" class="hidden">Неверный PIN!</div>
      </div>
    </div>
  </div>

  <!-- ШАПКА -->
  <div class="header">
    <div class="brand">POS Terminal</div>
    <div class="header-actions">
      <div class="icon-btn panic-btn-header" onclick="triggerPanicState()" title="Паника">🚨</div>
      <div class="icon-btn" onclick="openSettings()">⚙️</div>
    </div>
  </div>

  <!-- ДИСПЛЕЙ ВВОДА -->
  <div class="display-container">
    <div class="display-label">Сумма к оплате</div>
    <div class="amount-display">
      <span id="amount-val">0</span>
      <span class="currency">₽</span>
    </div>
  </div>

  <!-- KEYPAD -->
  <div class="keypad">
    <div class="key" onclick="pressNum('1')">1</div>
    <div class="key" onclick="pressNum('2')">2</div>
    <div class="key" onclick="pressNum('3')">3</div>
    <div class="key" onclick="pressNum('4')">4</div>
    <div class="key" onclick="pressNum('5')">5</div>
    <div class="key" onclick="pressNum('6')">6</div>
    <div class="key" onclick="pressNum('7')">7</div>
    <div class="key" onclick="pressNum('8')">8</div>
    <div class="key" onclick="pressNum('9')">9</div>
    <div class="key" onclick="pressNum('00')">00</div>
    <div class="key" onclick="pressNum('0')">0</div>
    <div class="key key-action" onclick="pressBackspace()">⌫</div>
  </div>

  <!-- КНОПКИ ДЕЙСТВИЯ -->
  <div class="action-buttons">
    <div class="btn-row">
      <button class="btn btn-pay" onclick="sendInvoice('qr')">
        <span>QR / СБП</span> 📱
      </button>
      <button class="btn btn-cash" onclick="sendInvoice('cash')">
        <span>Наличные</span> 💵
      </button>
    </div>

    <button id="confirm-cash-btn" class="btn btn-pay hidden" style="background:#10b981;" onclick="confirmCashSuccess()">
      <span>Подтвердить получение денег</span> ✅
    </button>

    <button class="btn btn-cancel" onclick="cancelPayment()">
      <span>🛑 Сбросить / Отменить</span>
    </button>
    <div id="status-toast" class="status-toast"></div>
  </div>

  <!-- МОДАЛЬНОЕ ОКНО НАСТРОЕК -->
  <div id="settings-modal" class="modal hidden">
    <div>
      <h2 style="color: #fff; margin-bottom: 20px;">⚙️ Настройки кассы</h2>
      
      <div class="modal-card" style="border-color: rgba(239, 68, 68, 0.4);">
        <h3 style="color:#ef4444; margin-top:0;">🚨 Помощь при панике</h3>
        <div class="form-group">
          <label>Задержка таймера (секунды)</label>
          <input type="number" id="panic-delay" placeholder="3" value="3">
        </div>
        <div class="form-group">
          <label>URL перенаправления экрана</label>
          <input type="text" id="panic-url" placeholder="https://google.com" value="https://google.com">
        </div>
        <button class="btn btn-panic" onclick="triggerPanicState()" style="margin-bottom: 8px;">Активировать ПАНИКУ 🚨</button>
        <button class="btn btn-cancel" onclick="stopPanicState()" style="background: rgba(255,255,255,0.05); color: #94a3b8;">Сбросить экстренный режим</button>
      </div>

      <div class="modal-card">
        <h3 style="color:#38bdf8; margin-top:0;">Ключи ЮKassa</h3>
        <div class="form-group">
          <label>Shop ID</label>
          <input type="text" id="shop-id" placeholder="123456">
        </div>
        <div class="form-group">
          <label>Secret Key</label>
          <input type="password" id="secret-key" placeholder="live_XXXXXXXXXX">
        </div>
      </div>
    </div>

    <div>
      <button class="btn btn-pay" onclick="saveKeys()" style="margin-bottom: 10px;">Сохранить настройки</button>
      <button class="btn btn-cancel" onclick="closeSettings()" style="background: rgba(255,255,255,0.1); color: #fff; border: none;">Закрыть</button>
    </div>
  </div>

<!-- Firebase & KEYPAD -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, set, get, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB8CBeK8m25rox6BYO8ep6JeBJ7ipmYViQ",
    authDomain: "moon-60c5a.firebaseapp.com",
    databaseURL: "https://moon-60c5a-default-rtdb.firebaseio.com",
    projectId: "moon-60c5a",
    storageBucket: "moon-60c5a.firebasestorage.app",
    messagingSenderId: "1010513396599",
    appId: "1:1010513396599:web:86cbb8164de80b1dcc9772",
    measurementId: "G-KKE1L09LHS"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const ADMIN_PIN = "1234";
  let currentAmount = "0";

  window.checkPin = function() {
    if (document.getElementById('pin-input').value === ADMIN_PIN) {
      document.getElementById('auth-modal').classList.add('hidden');
      loadSettingsFromDB();
    } else {
      document.getElementById('auth-error').classList.remove('hidden');
    }
  };

  window.pressNum = function(num) {
    if (currentAmount === "0") {
      if (num === "00") return;
      currentAmount = num;
    } else {
      if (currentAmount.length < 7) { currentAmount += num; }
    }
    updateDisplay();
    sendDraftAmount();
  };

  window.pressBackspace = function() {
    if (currentAmount.length > 1) { currentAmount = currentAmount.slice(0, -1); }
    else { currentAmount = "0"; }
    updateDisplay();
    sendDraftAmount();
  };

  function updateDisplay() {
    document.getElementById('amount-val').innerText = parseInt(currentAmount).toLocaleString('ru-RU');
  }

  // Передача черновой суммы на экран
  function sendDraftAmount() {
    set(ref(db, 'draft_checkout/'), {
      amount: parseInt(currentAmount)
    });
  }

  // Выставить счет
  window.sendInvoice = function(mode) {
    const val = parseInt(currentAmount);
    const toast = document.getElementById('status-toast');

    if (val <= 0) {
      toast.style.color = "#ef4444";
      toast.innerText = "Введите сумму!";
      return;
    }

    set(ref(db, 'current_checkout/'), {
      amount: val,
      mode: mode,
      status: 'new',
      timestamp: Date.now()
    }).then(() => {
      // Сброс драфта
      set(ref(db, 'draft_checkout/'), { amount: 0 });

      if (mode === 'cash') {
        document.getElementById('confirm-cash-btn').classList.remove('hidden');
        toast.style.color = "#38bdf8";
        toast.innerText = `Ожидание передачи ${val} ₽ наличными`;
      } else {
        toast.style.color = "#38bdf8";
        toast.innerText = `✅ QR-код на ${val} ₽ на экране!`;
        currentAmount = "0";
        updateDisplay();
        setTimeout(() => toast.innerText = '', 3000);
      }
    });
  };

  // Подтверждение наличных кассиром
  window.confirmCashSuccess = function() {
    set(ref(db, 'current_checkout/status'), 'cash_succeeded');
    document.getElementById('confirm-cash-btn').classList.add('hidden');
    const toast = document.getElementById('status-toast');
    toast.style.color = "#34d399";
    toast.innerText = "✅ Наличные получены!";
    currentAmount = "0";
    updateDisplay();
    setTimeout(() => toast.innerText = '', 3000);
  };

  // Сброс
  window.cancelPayment = function() {
    const toast = document.getElementById('status-toast');
    document.getElementById('confirm-cash-btn').classList.add('hidden');
    set(ref(db, 'draft_checkout/'), { amount: 0 });
    set(ref(db, 'current_checkout/'), {
      status: 'canceled',
      timestamp: Date.now()
    }).then(() => {
      toast.style.color = "#ef4444";
      toast.innerText = "🛑 Отменено";
      currentAmount = "0";
      updateDisplay();
      setTimeout(() => toast.innerText = '', 3000);
    });
  };

  window.triggerPanicState = function() {
    const delay = parseInt(document.getElementById('panic-delay').value) || 0;
    const url = document.getElementById('panic-url').value.trim() || "https://google.com";

    set(ref(db, 'panic_state/'), { active: true, delaySeconds: delay, redirectUrl: url, timestamp: Date.now() });
  };

  window.stopPanicState = function() {
    set(ref(db, 'panic_state/'), { active: false, timestamp: Date.now() });
  };

  window.openSettings = function() { document.getElementById('settings-modal').classList.remove('hidden'); };
  window.closeSettings = function() { document.getElementById('settings-modal').classList.add('hidden'); };

  async function loadSettingsFromDB() {
    const snap = await get(ref(db, 'settings/'));
    if (snap.exists()) {
      const data = snap.val();
      if (data.shopId) document.getElementById('shop-id').value = data.shopId;
      if (data.secretKey) document.getElementById('secret-key').value = data.secretKey;
      if (data.panicDelay !== undefined) document.getElementById('panic-delay').value = data.panicDelay;
      if (data.panicUrl) document.getElementById('panic-url').value = data.panicUrl;
    }
  }

  window.saveKeys = function() {
    const shopId = document.getElementById('shop-id').value.trim();
    const secretKey = document.getElementById('secret-key').value.trim();
    const panicDelay = parseInt(document.getElementById('panic-delay').value) || 0;
    const panicUrl = document.getElementById('panic-url').value.trim() || "https://google.com";

    update(ref(db, 'settings/'), { shopId, secretKey, panicDelay, panicUrl }).then(() => {
      alert("Сохранено!");
      closeSettings();
    });
  };
</script>

</body>
</html>
