<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админка Кассы</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; margin: 0; padding: 16px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 450px; }
    .card { background: #1e293b; border-radius: 16px; padding: 20px; margin-bottom: 16px; border: 1px solid #334155; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
    h2, h3 { margin-top: 0; color: #f1f5f9; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 14px; color: #94a3b8; margin-bottom: 6px; }
    input[type="text"], input[type="number"], input[type="password"] {
      width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 16px; outline: none;
    }
    input:focus { border-color: #3b82f6; }
    .btn {
      width: 100%; padding: 14px; border-radius: 10px; border: none; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s;
    }
    .btn-primary { background: #2563eb; color: white; }
    .btn-primary:active { background: #1d4ed8; }
    .btn-success { background: #10b981; color: white; }
    .btn-success:active { background: #059669; }
    .toggle-group { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #334155; }
    .toggle-group:last-child { border-bottom: none; }
    .switch { position: relative; display: inline-block; width: 48px; height: 26px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #475569; transition: .4s; border-radius: 34px; }
    .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: #10b981; }
    input:checked + .slider:before { transform: translateX(22px); }
    .hidden { display: none !important; }
    .status-msg { text-align: center; font-size: 14px; color: #38bdf8; margin-top: 8px; }
  </style>
</head>
<body>

<div class="container">

  <!-- ЭКРАН 1: Авторизация -->
  <div id="auth-screen" class="card">
    <h2>🔐 Вход в панель</h2>
    <div class="form-group">
      <label>Введите PIN-код</label>
      <input type="password" id="pin-input" placeholder="****" inputmode="numeric">
    </div>
    <button class="btn btn-primary" onclick="checkPin()">Войти</button>
    <div id="auth-error" style="color: #ef4444; margin-top: 10px; font-size: 14px;" class="hidden">Неверный PIN-код!</div>
  </div>

  <!-- ЭКРАН 2: Главная Панель -->
  <div id="main-screen" class="hidden">
    
    <!-- Карточка 1: Выставление счета -->
    <div class="card">
      <h2>💸 Выставить счет</h2>
      <div class="form-group">
        <label>Сумма к оплате (₽)</label>
        <input type="number" id="amount-input" placeholder="Например: 500" inputmode="decimal">
      </div>
      <button class="btn btn-success" onclick="sendInvoice()">Вывести на экран 🚀</button>
      <div id="invoice-status" class="status-msg"></div>
    </div>

    <!-- Карточка 2: Настройки способов оплаты -->
    <div class="card">
      <h3>💳 Способы оплаты</h3>
      <div class="toggle-group">
        <span>Система быстрых платежей (СБП)</span>
        <label class="switch">
          <input type="checkbox" id="method-sbp" checked onchange="savePaymentMethods()">
          <span class="slider"></span>
        </label>
      </div>
      <div class="toggle-group">
        <span>SberPay</span>
        <label class="switch">
          <input type="checkbox" id="method-sber" checked onchange="savePaymentMethods()">
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <!-- Карточка 3: Настройки ЮKassa -->
    <div class="card">
      <h3>⚙️ Ключи ЮKassa</h3>
      <div class="form-group">
        <label>Shop ID</label>
        <input type="text" id="shop-id" placeholder="123456">
      </div>
      <div class="form-group">
        <label>Секретный ключ (live_...)</label>
        <input type="password" id="secret-key" placeholder="live_XXXXXXXXXXXXXX">
      </div>
      <button class="btn btn-primary" onclick="saveKeys()">Сохранить ключи</button>
      <div id="keys-status" class="status-msg"></div>
    </div>

  </div>

</div>

<!-- Firebase SDK Module -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, set, get, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  // Твой конфиг Firebase
  const firebaseConfig = {
    apiKey: "AIzaSyB8CBeK8m25rox6BYO8ep6JeBJ7ipmYViQ",
    authDomain: "moon-60c5a.firebaseapp.com",
    databaseURL: "https://moon-60c5a-default-rtdb.firebaseio.com",
    projectId: "moon-60c5a",
    storageBucket: "moon-60c5a.firebasestorage.app",
    messagingSenderId: "1010513396599",
    appId: "1:1010513396599:web:86cbb8164de80b1dcc9772",
    measurementId: "G-KKE1L09LHS"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const ADMIN_PIN = "1234"; // Пароль для входа (можешь поменять здесь)

  // Проверка ПИН-кода
  window.checkPin = function() {
    const pin = document.getElementById('pin-input').value;
    if (pin === ADMIN_PIN) {
      document.getElementById('auth-screen').classList.add('hidden');
      document.getElementById('main-screen').classList.remove('hidden');
      loadSettingsFromDB();
    } else {
      document.getElementById('auth-error').classList.remove('hidden');
    }
  };

  // Загрузка настроек из базы при входе
  async function loadSettingsFromDB() {
    try {
      const snapshot = await get(ref(db, 'settings/'));
      if (snapshot.exists()) {
        const data = snapshot.val();
        if (data.shopId) document.getElementById('shop-id').value = data.shopId;
        if (data.secretKey) document.getElementById('secret-key').value = data.secretKey;
        if (data.methods) {
          document.getElementById('method-sbp').checked = !!data.methods.sbp;
          document.getElementById('method-sber').checked = !!data.methods.sber;
        }
      }
    } catch (e) {
      console.error("Ошибка загрузки:", e);
    }
  }

  // Отправка суммы на экран
  window.sendInvoice = function() {
    const amount = document.getElementById('amount-input').value;
    const statusDiv = document.getElementById('invoice-status');

    if (!amount || amount <= 0) {
      statusDiv.style.color = '#ef4444';
      statusDiv.innerText = "Введите корректную сумму!";
      return;
    }

    set(ref(db, 'current_checkout/'), {
      amount: parseFloat(amount),
      status: 'new',
      timestamp: Date.now()
    }).then(() => {
      statusDiv.style.color = '#38bdf8';
      statusDiv.innerText = `Счет на ${amount} ₽ отправлен!`;
      document.getElementById('amount-input').value = '';
      setTimeout(() => statusDiv.innerText = '', 3000);
    }).catch((err) => {
      statusDiv.style.color = '#ef4444';
      statusDiv.innerText = "Ошибка записи в базу!";
    });
  };

  // Сохранение способов оплаты
  window.savePaymentMethods = function() {
    const sbp = document.getElementById('method-sbp').checked;
    const sber = document.getElementById('method-sber').checked;

    update(ref(db, 'settings/methods/'), {
      sbp: sbp,
      sber: sber
    });
  };

  // Сохранение ключей ЮKassa
  window.saveKeys = function() {
    const shopId = document.getElementById('shop-id').value.trim();
    const secretKey = document.getElementById('secret-key').value.trim();
    const statusDiv = document.getElementById('keys-status');

    if (!shopId || !secretKey) {
      statusDiv.style.color = '#ef4444';
      statusDiv.innerText = "Заполните оба поля!";
      return;
    }

    update(ref(db, 'settings/'), {
      shopId: shopId,
      secretKey: secretKey
    }).then(() => {
      statusDiv.style.color = '#10b981';
      statusDiv.innerText = "Ключи успешно обновлены!";
      setTimeout(() => statusDiv.innerText = '', 3000);
    }).catch((err) => {
      statusDiv.style.color = '#ef4444';
      statusDiv.innerText = "Ошибка сохранения!";
    });
  };
</script>

</body>
</html>
