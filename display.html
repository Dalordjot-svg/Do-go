<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Экран Оплаты</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    body {
      background-color: #0b0f19;
      color: #ffffff;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* 1. КАРУСЕЛЬ БАННЕРОВ (РЕЖИМ ПОКОЯ) */
    .slider-container {
      position: absolute;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1;
      transition: transform 0.8s cubic-bezier(0.6, -0.28, 0.735, 0.045), opacity 0.6s ease;
    }

    .slider-container.fall-down {
      transform: translateY(120vh) rotate(15deg);
      opacity: 0;
    }

    .slide {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      transform: translateX(-100%);
      transition: all 0.8s ease-in-out;
    }

    .slide.active { opacity: 1; transform: translateX(0); }
    .slide.exit { opacity: 0; transform: translateX(100%); }

    .ad-image {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 24px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.6);
    }

    .text-banner {
      width: 85vw;
      height: 80vh;
      background: #151c2c;
      border: 2px solid #232d42;
      border-radius: 28px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }

    .text-banner h1 {
      font-size: 48px;
      font-weight: 900;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 20px;
    }

    .text-banner p { font-size: 26px; color: #94a3b8; max-width: 600px; line-height: 1.4; }

    /* 2. ЭКРАН ПРЕДВАРИТЕЛЬНОГО ВВОДА СУММЫ (Слева Сумма, Справа Картинка) */
    .preview-screen {
      position: absolute;
      width: 90vw;
      height: 85vh;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 40px;
      z-index: 10;
      opacity: 0;
      transform: translateY(-30px);
      transition: all 0.5s ease;
      pointer-events: none;
    }

    .preview-screen.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .preview-left {
      flex: 1;
      background: #151c2c;
      border: 2px solid #232d42;
      border-radius: 32px;
      padding: 50px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    }

    .preview-label {
      font-size: 24px;
      color: #94a3b8;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }

    .preview-amount {
      font-size: 72px;
      font-weight: 900;
      color: #38bdf8;
      text-shadow: 0 0 30px rgba(56, 189, 248, 0.3);
    }

    .preview-right {
      flex: 1;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .preview-right img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 32px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    }

    /* 3. ГЛАВНЫЙ КОНТЕЙНЕР ОПЛАТЫ (Оплата QR или Наличными) */
    .container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 50px;
      width: 90%;
      max-width: 950px;
      background: #151c2c;
      padding: 40px;
      border-radius: 28px;
      border: 1px solid #232d42;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      z-index: 15;
      
      transform: translateY(-120vh);
      opacity: 0;
      transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .container.drop-in { transform: translateY(0); opacity: 1; }
    .container.fall-down { transform: translateY(120vh) rotate(-10deg); opacity: 0; }

    .left-side { display: flex; flex-direction: column; align-items: center; flex: 1; }

    .qr-card {
      background: #ffffff;
      padding: 20px;
      border-radius: 24px;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.3);
      opacity: 0;
      transform: scale(0.7);
      transition: all 0.5s ease;
    }

    .qr-card.visible { opacity: 1; transform: scale(1); }

    /* Табло расчета Наличными (К оплате / Принято / Сдача) */
    .cash-details-box {
      width: 100%;
      background: rgba(11, 15, 25, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .cash-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 20px;
      color: #94a3b8;
      font-weight: 600;
    }

    .cash-row-val {
      font-size: 28px;
      font-weight: 800;
      color: #ffffff;
    }

    .cash-row-change {
      border-top: 1px dashed rgba(255, 255, 255, 0.1);
      padding-top: 12px;
      margin-top: 4px;
    }

    .cash-row-change .cash-row-val {
      font-size: 36px;
      font-weight: 900;
      color: #34d399;
      text-shadow: 0 0 20px rgba(52, 211, 153, 0.3);
    }

    .loader-box { display: flex; align-items: center; gap: 12px; margin-top: 15px; color: #94a3b8; font-size: 18px; }
    .spinner { border: 4px solid #232d42; border-top: 4px solid #10b981; border-radius: 50%; width: 28px; height: 28px; animation: spin 0.8s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .right-side { display: flex; flex-direction: column; align-items: center; text-align: center; flex: 1; }
    .title-text { font-size: 38px; font-weight: 900; line-height: 1.2; background: linear-gradient(135deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 20px; }

    /* 4. ЗЕЛЕНАЯ ВОЛНА И МОДАЛЬНОЕ ОКНО ЧАЕВЫХ */
    .wave-bg {
      position: absolute;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, #10b981 0%, #059669 100%);
      top: 0; left: 0;
      z-index: 30;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      opacity: 0;
      transform: scale(0);
      border-radius: 50%;
      transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .wave-bg.active { opacity: 1; transform: scale(2); border-radius: 0; }
    .check-mark { font-size: 90px; }
    .success-text { font-size: 40px; font-weight: 900; color: #ffffff; margin-top: 10px; text-align: center; }

    .tips-modal {
      position: absolute;
      z-index: 40;
      background: #151c2c;
      border: 1px solid #334155;
      padding: 30px;
      border-radius: 28px;
      text-align: center;
      max-width: 500px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.7);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .tips-grid { display: flex; gap: 12px; }
    .tip-btn {
      background: #232d42;
      border: 1px solid #3b82f6;
      color: #fff;
      padding: 12px 20px;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
    }

    .panic-screen {
      position: absolute; width: 100%; height: 100%; background: #000000;
      top: 0; left: 0; z-index: 50; display: flex; flex-direction: column;
      justify-content: center; align-items: center; text-align: center;
    }
    .panic-title { font-size: 42px; font-weight: 900; color: #ef4444; }
    .panic-timer { font-size: 72px; font-weight: 900; color: #ffffff; margin: 20px 0; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- Экран Паники -->
  <div id="panic-screen" class="panic-screen hidden">
    <div class="panic-title">Перенаправление...</div>
    <div id="panic-timer" class="panic-timer">3</div>
  </div>

  <!-- Зеленая Волна Оплаты -->
  <div id="wave-screen" class="wave-bg">
    <div class="check-mark">✅</div>
    <div class="success-text">Спасибо за покупку! 💚</div>
  </div>

  <!-- Чаевые -->
  <div id="tips-modal" class="tips-modal hidden">
    <h2 style="margin:0; color:#fff;">Не хотите оставить чаевые? ☕</h2>
    <p style="color:#94a3b8; margin:0;">Выберите процент от суммы заказа:</p>
    <div class="tips-grid">
      <button class="tip-btn" onclick="selectTip(5)">5%</button>
      <button class="tip-btn" onclick="selectTip(10)">10%</button>
      <button class="tip-btn" onclick="selectTip(15)">15%</button>
    </div>
    <button class="tip-btn" style="background:transparent; border-color:#64748b; color:#94a3b8;" onclick="closeTips()">Нет, спасибо</button>
  </div>

  <!-- Карусель Баннеров (Режим покой) -->
  <div id="slider" class="slider-container">
    <div class="slide active"><img src="IMG_2845.png" class="ad-image" alt="Реклама 1"></div>
    <div class="slide"><img src="IMG_2851.png" class="ad-image" alt="Реклама 2"></div>
    <div class="slide">
      <div class="text-banner">
        <h1>Ищем сотрудников! ☕</h1>
        <p>Кафе <b>Moon</b> приглашает в команду бариста и кассиров!</p>
      </div>
    </div>
  </div>

  <!-- ПРЕДВАРИТЕЛЬНЫЙ ЭКРАН (Слева Сумма, Справа Картинка) -->
  <div id="preview-screen" class="preview-screen">
    <div class="preview-left">
      <div class="preview-label">К оплате:</div>
      <div id="preview-val" class="preview-amount">0 ₽</div>
    </div>
    <div class="preview-right">
      <img src="IMG_2845.png" alt="Декоративное фото">
    </div>
  </div>

  <!-- ГЛАВНЫЙ КОНТЕЙНЕР ОПЛАТЫ (QR или Наличные) -->
  <div id="payment-container" class="container">
    <div class="left-side">
      <!-- QR Код -->
      <div id="qr-box" class="qr-card">
        <div id="qrcode"></div>
      </div>

      <!-- Табло Оплаты Наличными -->
      <div id="cash-box" class="cash-details-box hidden">
        <div class="cash-row">
          <span>К оплате:</span>
          <span id="cash-total-val" class="cash-row-val">0 ₽</span>
        </div>
        <div class="cash-row">
          <span>Принято от клиента:</span>
          <span id="cash-received-val" class="cash-row-val" style="color:#38bdf8;">0 ₽</span>
        </div>
        <div class="cash-row cash-row-change">
          <span>Сдача:</span>
          <span id="cash-change-val" class="cash-row-val">0 ₽</span>
        </div>
      </div>

      <div id="status-box" class="loader-box">
        <div class="spinner"></div>
        <span id="status-text">Ожидание оплаты...</span>
      </div>
    </div>

    <div class="right-side">
      <div id="pay-title" class="title-text">Отсканируй меня<br>и оплати</div>
      <div style="font-size: 80px;">👀</div>
    </div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, onValue, get, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB8CBeK8m25rox6BYO8ep6JeBJ7ipmYViQ",
    authDomain: "moon-60c5a.firebaseapp.com",
    databaseURL: "https://moon-60c5a-default-rtdb.firebaseio.com",
    projectId: "moon-60c5a",
    storageBucket: "moon-60c5a.firebasestorage.app",
    messagingSenderId: "1010513396599",
    appId: "1:1010513396599:web:86cbb8164de80b1dcc9772",
    measurementId: "G-KKE1L09LHS"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  let pollInterval = null;
  let currentTimestamp = null;
  let panicCountdownInterval = null;
  let currentBaseAmount = 0;

  // 1. КАРУСЕЛЬ БАННЕРОВ (10 сек)
  const slides = document.querySelectorAll('.slide');
  let currentSlide = 0;
  setInterval(() => {
    slides[currentSlide].classList.remove('active');
    slides[currentSlide].classList.add('exit');
    currentSlide = (currentSlide + 1) % slides.length;
    setTimeout(() => {
      slides.forEach(s => s.classList.remove('exit'));
      slides[currentSlide].classList.add('active');
    }, 400);
  }, 10000);

  // 2. СЛУШАЕМ ПРЕДВАРИТЕЛЬНУЮ СУММУ (Клавиатура на телефоне)
  onValue(ref(db, 'draft_checkout/'), (snapshot) => {
    const data = snapshot.val();
    const prevScreen = document.getElementById('preview-screen');
    const slider = document.getElementById('slider');

    if (data && data.amount && data.amount > 0) {
      document.getElementById('preview-val').innerText = `${data.amount.toLocaleString('ru-RU')} ₽`;
      prevScreen.classList.add('visible');
      slider.style.opacity = '0';
    } else {
      prevScreen.classList.remove('visible');
      slider.style.opacity = '1';
    }
  });

  // 3. ПАНИКА
  onValue(ref(db, 'panic_state/'), (snapshot) => {
    const data = snapshot.val();
    if (data && data.active) {
      triggerPanic(data.delaySeconds || 0, data.redirectUrl || "https://google.com");
    } else {
      cancelPanic();
    }
  });

  function triggerPanic(seconds, redirectUrl) {
    if (pollInterval) clearInterval(pollInterval);
    document.getElementById('panic-screen').classList.remove('hidden');
    let timeLeft = parseInt(seconds);
    document.getElementById('panic-timer').innerText = timeLeft;
    if (panicCountdownInterval) clearInterval(panicCountdownInterval);
    if (timeLeft <= 0) { window.location.href = redirectUrl; return; }
    panicCountdownInterval = setInterval(() => {
      timeLeft--;
      document.getElementById('panic-timer').innerText = timeLeft;
      if (timeLeft <= 0) { clearInterval(panicCountdownInterval); window.location.href = redirectUrl; }
    }, 1000);
  }

  function cancelPanic() {
    if (panicCountdownInterval) clearInterval(panicCountdownInterval);
    document.getElementById('panic-screen').classList.add('hidden');
  }

  // 4. СЛУШАЕМ ОСНОВНУЮ ОПЛАТУ И РАСЧЕТ НАЛИЧНЫХ
  onValue(ref(db, 'current_checkout/'), async (snapshot) => {
    const data = snapshot.val();
    
    if (data && data.status === 'canceled') { resetToIdle(); return; }

    if (data && data.amount && data.status === 'new' && data.timestamp !== currentTimestamp) {
      currentTimestamp = data.timestamp;
      currentBaseAmount = data.amount;

      document.getElementById('preview-screen').classList.remove('visible');
      document.getElementById('slider').classList.add('fall-down');

      setTimeout(async () => {
        const payBox = document.getElementById('payment-container');
        payBox.classList.remove('fall-down');
        payBox.classList.add('drop-in');

        if (data.mode === 'cash') {
          // ОПЛАТА НАЛИЧНЫМИ
          document.getElementById('qr-box').classList.add('hidden');
          document.getElementById('cash-box').classList.remove('hidden');
          document.getElementById('pay-title').innerText = "Оплата наличными";
          document.getElementById('status-text').innerText = "Расчет с кассиром...";

          // Обновляем табло наличного расчета
          const received = data.cashReceived || 0;
          const change = Math.max(0, received - data.amount);

          document.getElementById('cash-total-val').innerText = `${data.amount.toLocaleString('ru-RU')} ₽`;
          document.getElementById('cash-received-val').innerText = `${received.toLocaleString('ru-RU')} ₽`;
          document.getElementById('cash-change-val').innerText = `${change.toLocaleString('ru-RU')} ₽`;

        } else {
          // ОПЛАТА QR / СБП
          document.getElementById('cash-box').classList.add('hidden');
          document.getElementById('qr-box').classList.remove('hidden');
          document.getElementById('qr-box').classList.remove('visible');
          document.getElementById('pay-title').innerHTML = "Отсканируй меня<br>и оплати";
          document.getElementById('status-text').innerText = "Ожидание оплаты...";
          document.getElementById('qrcode').innerHTML = "";

          const settingsSnap = await get(ref(db, 'settings/'));
          const settings = settingsSnap.val();

          if (settings && settings.shopId && settings.secretKey) {
            createYooKassaPayment(data.amount, settings.shopId, settings.secretKey);
          }
        }
      }, 500);
    }

    // Обновление сумм наличных на лету (пока открыт чек)
    if (data && data.mode === 'cash' && data.status === 'new') {
      const received = data.cashReceived || 0;
      const change = Math.max(0, received - data.amount);
      document.getElementById('cash-received-val').innerText = `${received.toLocaleString('ru-RU')} ₽`;
      document.getElementById('cash-change-val').innerText = `${change.toLocaleString('ru-RU')} ₽`;
    }

    // Успех наличного расчета
    if (data && data.status === 'cash_succeeded') {
      showSuccessFlow();
    }
  });

  async function createYooKassaPayment(amount, shopId, secretKey) {
    const proxyUrl = "https://corsproxy.io/?";
    const targetUrl = "https://api.yookassa.ru/v3/payments";
    const authHeader = "Basic " + btoa(`${shopId}:${secretKey}`);

    try {
      const response = await fetch(proxyUrl + encodeURIComponent(targetUrl), {
        method: "POST",
        headers: {
          "Authorization": authHeader,
          "Idempotence-Key": Date.now().toString(),
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          amount: { value: amount.toFixed(2), currency: "RUB" },
          payment_method_data: { type: "sbp" },
          confirmation: { type: "qr" },
          capture: true,
          description: "Оплата по QR"
        })
      });

      const resData = await response.json();
      if (resData.confirmation && resData.confirmation.confirmation_data) {
        new QRCode(document.getElementById("qrcode"), {
          text: resData.confirmation.confirmation_data,
          width: 220,
          height: 220
        });

        setTimeout(() => document.getElementById('qr-box').classList.add('visible'), 100);
        if (pollInterval) clearInterval(pollInterval);
        pollInterval = setInterval(() => checkStatus(resData.id, authHeader), 3000);
      }
    } catch (err) { console.error(err); }
  }

  async function checkStatus(paymentId, authHeader) {
    const proxyUrl = "https://corsproxy.io/?";
    const targetUrl = `https://api.yookassa.ru/v3/payments/${paymentId}`;
    try {
      const res = await fetch(proxyUrl + encodeURIComponent(targetUrl), { headers: { "Authorization": authHeader } });
      const data = await res.json();
      if (data.status === 'succeeded') {
        clearInterval(pollInterval);
        showSuccessFlow();
      }
    } catch (e) { console.error(e); }
  }

  function showSuccessFlow() {
    document.getElementById('wave-screen').classList.add('active');
    setTimeout(() => {
      document.getElementById('wave-screen').classList.remove('active');
      document.getElementById('tips-modal').classList.remove('hidden');
    }, 2500);
  }

  window.selectTip = function(percent) {
    const tipVal = Math.round((currentBaseAmount * percent) / 100);
    set(ref(db, 'tips_records/'), {
      baseAmount: currentBaseAmount,
      tipPercent: percent,
      tipVal: tipVal,
      timestamp: Date.now()
    });
    closeTips();
  };

  window.closeTips = function() {
    document.getElementById('tips-modal').classList.add('hidden');
    resetToIdle();
  };

  function resetToIdle() {
    if (pollInterval) clearInterval(pollInterval);
    const payBox = document.getElementById('payment-container');
    payBox.classList.remove('drop-in');
    payBox.classList.add('fall-down');
    setTimeout(() => {
      document.getElementById('slider').classList.remove('fall-down');
    }, 600);
  }
</script>

</body>
</html>
