<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Экран Оплаты</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    body {
      background-color: #0b0f19;
      color: #ffffff;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* Анимация Зеленой Волны Успеха */
    .wave-bg {
      position: absolute;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, #10b981 0%, #059669 100%);
      top: 0; left: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      opacity: 0;
      transform: scale(0);
      border-radius: 50%;
      transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .wave-bg.active {
      opacity: 1;
      transform: scale(2);
      border-radius: 0;
    }

    .success-text {
      position: relative;
      z-index: 11;
      font-size: 48px;
      font-weight: 900;
      text-align: center;
      color: #ffffff;
      text-shadow: 0 10px 20px rgba(0,0,0,0.3);
      animation: bounce 1s infinite alternate;
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-15px); }
    }

    /* ЭКРАН ПАНИКИ */
    .panic-screen {
      position: absolute;
      width: 100%;
      height: 100%;
      background: #000000;
      top: 0; left: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    .panic-title {
      font-size: 42px;
      font-weight: 900;
      color: #ef4444;
      margin-bottom: 10px;
    }

    .panic-timer {
      font-size: 72px;
      font-weight: 900;
      color: #ffffff;
      margin: 20px 0;
    }

    /* Главный контейнер оплаты */
    .container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 50px;
      width: 90%;
      max-width: 950px;
      background: #151c2c;
      padding: 40px;
      border-radius: 28px;
      border: 1px solid #232d42;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      z-index: 1;
    }

    .left-side {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .qr-card {
      background: #ffffff;
      padding: 20px;
      border-radius: 24px;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.3);
      opacity: 0;
      transform: scale(0.7) rotate(-5deg);
      transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .qr-card.visible {
      opacity: 1;
      transform: scale(1) rotate(0deg);
      animation: pulseGlow 2s infinite alternate;
    }

    @keyframes pulseGlow {
      from { box-shadow: 0 0 25px rgba(16, 185, 129, 0.4); }
      to { box-shadow: 0 0 50px rgba(16, 185, 129, 0.8); }
    }

    .amount-badge {
      font-size: 42px;
      font-weight: 900;
      color: #10b981;
      margin-top: 15px;
      text-shadow: 0 0 10px rgba(16, 185, 129, 0.3);
    }

    .loader-box {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 15px;
      color: #94a3b8;
      font-size: 18px;
    }

    .spinner {
      border: 4px solid #232d42;
      border-top: 4px solid #10b981;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .right-side {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .title-text {
      font-size: 38px;
      font-weight: 900;
      line-height: 1.2;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 20px;
    }

    .eyes {
      font-size: 85px;
      display: inline-block;
      animation: eyeWiggle 2.5s infinite ease-in-out;
      user-select: none;
    }

    @keyframes eyeWiggle {
      0%, 100% { transform: translateX(0) rotate(0deg); }
      20% { transform: translateX(-18px) rotate(-10deg); }
      40% { transform: translateX(18px) rotate(10deg); }
      60% { transform: translateY(-10px); }
    }

    /* ЭКРАН РЕКЛАМЫ (IDLE) */
    .idle-box {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    .ad-image {
      max-width: 95vw;
      max-height: 95vh;
      object-fit: contain; /* Сохраняет пропорции картинки без обрезки */
      border-radius: 24px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.5);
      animation: fadeInAd 1.5s ease-in-out;
    }

    @keyframes fadeInAd {
      from { opacity: 0; transform: scale(0.97); }
      to { opacity: 1; transform: scale(1); }
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- Экран Паники -->
  <div id="panic-screen" class="panic-screen hidden">
    <div class="panic-title">Перенаправление...</div>
    <div id="panic-timer" class="panic-timer">3</div>
  </div>

  <!-- Зеленая Волна Оплаты -->
  <div id="wave-screen" class="wave-bg">
    <div class="success-text">
      <div style="font-size: 90px; margin-bottom: 10px;">🎉</div>
      Спасибо большое<br>за покупку! 💚
    </div>
  </div>

  <!-- Экран Покоя (Рекламный баннер) -->
  <div id="idle-screen" class="idle-box">
    <!-- Ссылка на файл в твоем репозитории -->
    <img src="IMG_2845.png" class="ad-image" alt="Рекламный баннер">
  </div>

  <!-- Контейнер Оплаты -->
  <div id="payment-container" class="container hidden">
    <div class="left-side">
      <div id="qr-box" class="qr-card">
        <div id="qrcode"></div>
      </div>
      <div id="amount-display" class="amount-badge">0 ₽</div>
      <div id="status-box" class="loader-box">
        <div class="spinner"></div>
        <span>Ожидание оплаты...</span>
      </div>
    </div>

    <div class="right-side">
      <div class="title-text">Отсканируй меня<br>и оплати</div>
      <div class="eyes">👀</div>
    </div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, onValue, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB8CBeK8m25rox6BYO8ep6JeBJ7ipmYViQ",
    authDomain: "moon-60c5a.firebaseapp.com",
    databaseURL: "https://moon-60c5a-default-rtdb.firebaseio.com",
    projectId: "moon-60c5a",
    storageBucket: "moon-60c5a.firebasestorage.app",
    messagingSenderId: "1010513396599",
    appId: "1:1010513396599:web:86cbb8164de80b1dcc9772",
    measurementId: "G-KKE1L09LHS"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  let pollInterval = null;
  let currentTimestamp = null;
  let panicCountdownInterval = null;

  // 1. Слушаем Панику
  onValue(ref(db, 'panic_state/'), (snapshot) => {
    const data = snapshot.val();
    if (data && data.active) {
      triggerPanic(data.delaySeconds || 0, data.redirectUrl || "https://google.com");
    } else {
      cancelPanic();
    }
  });

  function triggerPanic(seconds, redirectUrl) {
    if (pollInterval) clearInterval(pollInterval);
    
    document.getElementById('panic-screen').classList.remove('hidden');
    let timeLeft = parseInt(seconds);

    document.getElementById('panic-timer').innerText = timeLeft;

    if (panicCountdownInterval) clearInterval(panicCountdownInterval);

    if (timeLeft <= 0) {
      window.location.href = redirectUrl;
      return;
    }

    panicCountdownInterval = setInterval(() => {
      timeLeft--;
      document.getElementById('panic-timer').innerText = timeLeft;

      if (timeLeft <= 0) {
        clearInterval(panicCountdownInterval);
        window.location.href = redirectUrl;
      }
    }, 1000);
  }

  function cancelPanic() {
    if (panicCountdownInterval) clearInterval(panicCountdownInterval);
    document.getElementById('panic-screen').classList.add('hidden');
  }

  // 2. Слушаем Оплату
  onValue(ref(db, 'current_checkout/'), async (snapshot) => {
    const data = snapshot.val();
    
    // Сброс или отмена
    if (data && data.status === 'canceled') {
      resetToIdle();
      return;
    }

    // Новая оплата
    if (data && data.amount && data.status === 'new' && data.timestamp !== currentTimestamp) {
      currentTimestamp = data.timestamp;
      
      document.getElementById('idle-screen').classList.add('hidden');
      document.getElementById('payment-container').classList.remove('hidden');
      document.getElementById('amount-display').innerText = `${data.amount} ₽`;

      const qrBox = document.getElementById('qr-box');
      qrBox.classList.remove('visible');
      document.getElementById('qrcode').innerHTML = "";

      const settingsSnap = await get(ref(db, 'settings/'));
      const settings = settingsSnap.val();

      if (settings && settings.shopId && settings.secretKey) {
        let paymentType = "sbp";
        if (settings.methods && !settings.methods.sbp && settings.methods.sber) {
          paymentType = "sberbank";
        }
        createYooKassaPayment(data.amount, settings.shopId, settings.secretKey, paymentType);
      }
    }
  });

  async function createYooKassaPayment(amount, shopId, secretKey, paymentType) {
    const proxyUrl = "https://corsproxy.io/?";
    const targetUrl = "https://api.yookassa.ru/v3/payments";
    const authHeader = "Basic " + btoa(`${shopId}:${secretKey}`);

    try {
      const response = await fetch(proxyUrl + encodeURIComponent(targetUrl), {
        method: "POST",
        headers: {
          "Authorization": authHeader,
          "Idempotence-Key": Date.now().toString(),
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          amount: { value: amount.toFixed(2), currency: "RUB" },
          payment_method_data: { type: paymentType },
          confirmation: { type: "qr" },
          capture: true,
          description: "Оплата по QR"
        })
      });

      const resData = await response.json();

      if (resData.confirmation && resData.confirmation.confirmation_data) {
        new QRCode(document.getElementById("qrcode"), {
          text: resData.confirmation.confirmation_data,
          width: 220,
          height: 220
        });

        setTimeout(() => document.getElementById('qr-box').classList.add('visible'), 100);

        if (pollInterval) clearInterval(pollInterval);
        pollInterval = setInterval(() => checkStatus(resData.id, authHeader), 3000);
      }
    } catch (err) {
      console.error(err);
    }
  }

  async function checkStatus(paymentId, authHeader) {
    const proxyUrl = "https://corsproxy.io/?";
    const targetUrl = `https://api.yookassa.ru/v3/payments/${paymentId}`;

    try {
      const res = await fetch(proxyUrl + encodeURIComponent(targetUrl), {
        headers: { "Authorization": authHeader }
      });
      const data = await res.json();

      if (data.status === 'succeeded') {
        clearInterval(pollInterval);
        
        document.getElementById('wave-screen').classList.add('active');
        
        setTimeout(() => {
          document.getElementById('wave-screen').classList.remove('active');
          resetToIdle();
        }, 6000);
      }
    } catch (e) {
      console.error(e);
    }
  }

  function resetToIdle() {
    if (pollInterval) clearInterval(pollInterval);
    document.getElementById('payment-container').classList.add('hidden');
    document.getElementById('idle-screen').classList.remove('hidden');
  }
</script>

</body>
</html>
